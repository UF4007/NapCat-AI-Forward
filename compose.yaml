services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      MODE: ws # WebSocket server on 0.0.0.0:3001 inside the compose network only
    ports:
      - "127.0.0.1:6099:6099" # WebUI for QR login; 3001 is deliberately not published
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config

  bridge:
    image: node:22-alpine
    restart: unless-stopped
    depends_on: [napcat]
    working_dir: /app
    command: ["node", "src/index.mjs", "config.json"]
    volumes:
      - ./src:/app/src:ro
      - ./mcp:/app/mcp:ro
      - ./config.json:/app/config.json:ro
      - ./data/bridge:/app/data # long-term memory files (chat history stays in QQ)
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets llm.baseUrl reach a model server (e.g. Ollama) on the host
